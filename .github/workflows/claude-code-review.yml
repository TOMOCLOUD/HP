name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLAUDE_MODEL: claude-sonnet-5

jobs:
  # @claude メンションに応答（prompt なし = メンション応答モード自動判定）
  claude-mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model ${{ env.CLAUDE_MODEL }}

  # ドラフト解除時に自動レビュー（1回のみ）
  claude-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリは Next.js（App Router / TypeScript / Tailwind CSS）で構築された
            TOMOCLOUD の corporate サイトです。以下の観点でこの PR をレビューしてください。

            - バグ・ロジックの誤り
            - セキュリティ（入力値検証、シークレットの取り扱い、XSS/CSRF等）
            - 型安全性・Next.js/Reactのベストプラクティスからの逸脱
            - 不要な複雑化や重複コード

            **手順:**
            1. `gh pr view` と `gh pr diff` を使って、PR の概要・コードの変更点・行番号を把握します。
            2. 改善点や懸念事項があるコードの行には `mcp__github_inline_comment__create_inline_comment` を使ってインラインコメントを追加してください。修正方針が明確な場合には suggestion ブロックを積極的に利用してください。
            3. 最後に、全体のまとめコメントを COMMENT タイプの PR レビューとして提出してください:
               `gh pr review ${{ github.event.pull_request.number }} --comment --body "<まとめコメント>"`
               - `--approve` / `--request-changes` は使わず、PR をブロックしないでください。

            **インラインコメントの構成:**
            - 各コメントの冒頭で指摘内容の要点を一行で簡潔に述べてください。
            - 結論の後に理由・背景・具体的な修正案を詳しく説明してください。
            - ポジティブなフィードバックはインラインでは控えめにし、まとめコメントに集約してください。

            日本語で具体的で実行可能なフィードバックをしてください。
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Read,Glob,Grep"
